<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAT - تحويل إلى الموقع الرسمي</title>
    <!-- Open Graph Tags لمعاينة الفيسبوك -->
    <meta property="og:title" content="FIAT DZ - الموقع الرسمي">
    <meta property="og:description" content="انقر أدناه للانتقال إلى الموقع الرسمي لـ FIAT الجزائر">
    <meta property="og:image" content="https://i.ibb.co/3d7779/fiat-logo.jpg">
    <meta property="og:type" content="website">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 55px;
            font-weight: 900;
            color: #FF0033;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #FF0033;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 0, 51, 0.3);
            width: 100%;
        }
        .btn:hover {
            background-color: #d9002b;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوجو FIAT الأحمر -->
        <div class="logo">FIAT</div>
        
        <p>ليتم تحويلك للموقع الرسمي لـ fiat dz اضغط على زر تحويل أدناه:</p>
        
        <!-- زر التحويل اليدوي -->
        <a href="https://fiatdz.vercel.app/" class="btn">تحويل</a>
        
        <div class="footer">
            &copy; 2026 FIAT Algeria. All Rights Reserved.
        </div>
    </div>

</body>
</html>
