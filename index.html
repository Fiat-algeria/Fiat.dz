<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAT - تحويل إلى الموقع الرسمي</title>
    <!-- Open Graph Tags لمعاينة الفيسبوك -->
    <meta property="og:title" content="FIAT DZ - الموقع الرسمي">
    <meta property="og:description" content="جاري تحويلك إلى الموقع الرسمي لـ FIAT الجزائر...">
    <meta property="og:image" content="https://i.ibb.co/3d7779/fiat-logo.jpg">
    <meta property="og:type" content="website">
    
    <!-- كود التحويل التلقائي بعد ثانيتين -->
    <script>
        setTimeout(function() {
            window.location.href = "https://fiatdz.vercel.app/";
        }, 2000); // 2000 تعني 2 ثانية
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 55px;
            font-weight: 900;
            color: #FF0033;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF0033;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            background-color: #FF0033;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 0, 51, 0.3);
            width: 100%;
        }
        .btn:hover {
            background-color: #d9002b;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوجو FIAT الأحمر -->
        <div class="logo">FIAT</div>
        
        <!-- دائرة التحميل -->
        <div class="loader"></div>

        <p>جاري تحويلك تلقائياً إلى الموقع الرسمي لـ fiat dz...</p>
        
        <!-- زر احتياطي يدوياً إذا لم يعمل التحويل التلقائي -->
        <a href="https://fiatdz.vercel.app/" class="btn">إذا لم يتم تحويلك، اضغط هنا</a>
        
        <div class="footer">
            &copy; 2026 FIAT Algeria. All Rights Reserved.
        </div>
    </div>

</body>
</html>
